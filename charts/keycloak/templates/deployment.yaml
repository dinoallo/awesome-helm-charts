apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "keycloak.fullname" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.updateStrategy.type }}
    {{- if eq .Values.updateStrategy.type "RollingUpdate" }}
    {{- with .Values.updateStrategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "keycloak.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "keycloak.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "keycloak.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: keycloak
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - {{ if eq .Values.database.vendor "dev-file" }}start-dev{{ else }}start{{ end }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.service.managementPortEnabled }}
            - name: {{ .Values.service.managementPortName }}
              containerPort: {{ .Values.service.managementPort }}
              protocol: TCP
            {{- end }}
          env:
            # Admin credentials
            {{- if and .Values.auth.adminUser .Values.auth.existingAdminUserSecret }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingAdminUserSecret }}
                  key: admin-user
            {{- else if .Values.auth.adminUser }}
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.auth.adminUser | quote }}
            {{- end }}
            {{- if .Values.auth.existingAdminPasswordSecret }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingAdminPasswordSecret }}
                  key: admin-password
            {{- else if .Values.auth.adminPassword }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: {{ .Values.auth.adminPassword | quote }}
            {{- end }}

            # Database configuration
            - name: KC_DB
              value: {{ .Values.database.vendor | quote }}
            {{- if .Values.database.hostname }}
            - name: KC_DB_URL_HOST
              value: {{ .Values.database.hostname | quote }}
            - name: KC_DB_URL_PORT
              value: {{ .Values.database.port | quote }}
            - name: KC_DB_URL_DATABASE
              value: {{ .Values.database.database | quote }}
            {{- end }}
            {{- if .Values.database.username }}
            - name: KC_DB_USERNAME
              value: {{ .Values.database.username | quote }}
            {{- end }}
            {{- if .Values.database.existingPasswordSecret }}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingPasswordSecret }}
                  key: password
            {{- else if .Values.database.password }}
            - name: KC_DB_PASSWORD
              value: {{ .Values.database.password | quote }}
            {{- end }}
            {{- if .Values.database.schema }}
            - name: KC_DB_SCHEMA
              value: {{ .Values.database.schema | quote }}
            {{- end }}

            # Hostname configuration
            {{- if .Values.hostname.url }}
            - name: KC_HOSTNAME
              value: {{ .Values.hostname.url | quote }}
            {{- end }}
            {{- if .Values.hostname.adminUrl }}
            - name: KC_HOSTNAME_ADMIN_URL
              value: {{ .Values.hostname.adminUrl | quote }}
            {{- end }}
            {{- if .Values.hostname.strict }}
            - name: KC_HOSTNAME_STRICT
              value: "true"
            {{- end }}

            # Health endpoints
            - name: KC_HEALTH_ENABLED
              value: "true"
            # Listen on all interfaces for health checks
            - name: KC_HTTP_ENABLED
              value: "true"
            # Proxy headers settings (edge mode by default for ingress behind reverse proxy)
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- if eq .Values.database.vendor "dev-file" }}
            - name: data
              mountPath: /opt/keycloak/data
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.startupProbe }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- if eq .Values.database.vendor "dev-file" }}
        - name: data
          {{- if .Values.persistence.enabled }}
          {{- if .Values.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "keycloak.fullname" . }}-data
          {{- end }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
